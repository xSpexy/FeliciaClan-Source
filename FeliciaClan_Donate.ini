; ============================================================
; FELICIACLAN BAGIS SISTEMI AYARLARI
; Bu dosya yalnizca Donate sistemini etkiler.
; JBMenu ayarlari FeliciaClan_JBMenu.ini icinde kalir.
; ============================================================

; Bagis bildirimi ve SPR ekranda kac saniye kalacak?
"DISPLAY_TIME" "5.0"

; TL bagisi kademe sinirlari
; 1-10 TL = kademe 1, 11-50 TL = kademe 2, 51+ TL = kademe 3
"DONATE_TL_TIER1_MAX" "10"
"DONATE_TL_TIER2_MAX" "50"
"DONATE_TL_MAX_AMOUNT" "0"

; TL kademe SPR dosyalari (sprites/ klasorune gore, .spr uzantisi yazilmaz)
; Hareketli animasyon icin ayni isimle _0.spr ... _7.spr kareleri bulunmalidir.
"DONATE_TL_TIER1_SPRITE" "FeliciaClan/cypher"
"DONATE_TL_TIER1_SOUND" "buttons/button9.wav"

"DONATE_TL_TIER2_SPRITE" "FeliciaClan/donate_tl_2"
"DONATE_TL_TIER2_SOUND" "FeliciaClan/donate_tl_2.wav"

"DONATE_TL_TIER3_SPRITE" "FeliciaClan/donate_tl_3"
"DONATE_TL_TIER3_SOUND" "FeliciaClan/donate_tl_3.wav"

; Coin bagisi kademe sinirlari
; 1-10 Coin = kademe 1, 11-50 Coin = kademe 2, 51+ Coin = kademe 3
"DONATE_COIN_TIER1_MAX" "10"
"DONATE_COIN_TIER2_MAX" "50"
"DONATE_COIN_MAX_AMOUNT" "0"

; Coin kademe SPR ve sesleri
"DONATE_COIN_TIER1_SPRITE" "FeliciaClan/donate_coin_1"
"DONATE_COIN_TIER1_SOUND" "FeliciaClan/donate_coin_1.wav"

"DONATE_COIN_TIER2_SPRITE" "FeliciaClan/donate_coin_2"
"DONATE_COIN_TIER2_SOUND" "FeliciaClan/donate_coin_2.wav"

"DONATE_COIN_TIER3_SPRITE" "FeliciaClan/donate_coin_3"
"DONATE_COIN_TIER3_SOUND" "FeliciaClan/donate_coin_3.wav"
